[package]
name = "speciesnet-ensemble"
version = "0.0.2" # Please bump this when doing a release
authors = [
  "Bhattarapong Somwong <art@zubalis.com>",
  "Antony Harfield <antony@zubalis.com>",
  "Wasuphon Naksut <frongs@zubalis.com>",
]
description = "Ensemble components of speciesnet"
repository = "https://github.com/zubalis/speciesnet-rust"
homepage = "https://github.com/zubalis/speciesnet-rust"
license = "APACHE"
edition = "2024"

[lib]
name = "speciesnet_ensemble"
path = "src/lib.rs"

[dependencies]
csv = { workspace = true }
indexmap = "2.9"
serde_json = { workspace = true }
serde = { workspace = true }
speciesnet-core = { path = "../core" }
thiserror = { workspace = true }
tracing = { workspace = true }
